# Every key carries the source it comes from. Unknown keys raise at load.

[market]
# AEMC schedule of reliability settings, 2026-27 financial year (27 February 2026).
# These are the values applying from 1 July 2025 to 30 June 2026, taken as one
# internally consistent pair. Do not mix years: the cap and the threshold are
# indexed together and their ratio is what decides when the market is suspended.
market_price_cap_per_mwh = 20300.0          # value of lost load, the market price cap
administered_price_cap_per_mwh = 600.0      # permanent since the December 2023 rule
cumulative_price_threshold = 1823600.0      # AS PUBLISHED: see the interval note
cumulative_price_threshold_intervals_per_hour = 12
cumulative_price_window_hours = 168
# The threshold is published as a sum of TRADING INTERVAL prices, and a trading
# interval has been five minutes since five-minute settlement. That is what makes
# the AEMC's own gloss exact: $1,823,600 / $20,300 = 89.8 intervals = 7.5 hours at
# the cap, and the 2027 base $2,325,600 / $22,800 = 102 intervals = 8.5 hours.
# This model settles hourly, so one of its intervals stands for twelve of the
# market's. The threshold is therefore divided by twelve, not by two. Dividing by
# two would assume half-hourly settlement and let the market run about 45 hours at
# the cap before suspension instead of 7.5, leaving six times the scarcity rent
# standing.
minimum_price_per_mwh = -1000.0

[reliability]
# AEMC Reliability Panel. The standard in force is 0.002 per cent of unserved
# energy. The Panel's 2026 Reliability Standard and Settings Review final report
# (23 April 2026) recommends 0.003 per cent for 1 July 2028 to 30 June 2032, and
# nothing is published beyond that. This model uses the recommended figure for the
# whole horizon rather than stepping it at 2028, so the early years are measured
# against a standard slightly looser than the one in force today.
standard_use_fraction = 0.00003
interim_measure_use_fraction = 0.000006

[dispatch]
must_run_offer_per_mwh = -60.0              # a coal band bidding to avoid a shutdown
# Set from the economics, not to hit a price: a coal unit will accept a negative
# price down to about the cost of shutting down and restarting, spread over the
# hours it would be off. That is tens of dollars a MWh, not hundreds. It matters
# because this band is marginal in roughly a sixth of the year in a system with
# this much rooftop solar, so it moves the annual average price more than any
# other single number here.
# Wind and solar offers are per unit in fleet.csv, not a single constant here: the
# price in a surplus hour is set by whichever plant is on the margin of curtailment,
# so they have to be able to differ.
storage_spread_per_mwh = 8.0                # added to charging cost when offering
max_storage_passes = 6
storage_price_tolerance = 1.0               # peak block price convergence, $/MWh

[time]
# Time-of-day blocks, start hour inclusive to end hour exclusive.
block_overnight = [22, 6]
block_morning = [6, 10]
block_solar = [10, 16]
block_peak = [16, 22]

[weather]
shape_years = 5
hours_per_year = 8760
seed = 20260904
# Peak bands scale the peak, not annual energy.
peak_band_multipliers = [1.08, 1.00, 0.95]
peak_band_weights = [0.1, 0.8, 0.1]

[forward]
# Three anchors, at four, eight and twelve years ahead. A plant decided today
# commissions inside the first anchor and lives well past the last, so the anchors
# bracket the years its decision actually turns on and the tail beyond them is
# assumed rather than projected.
anchor_offsets = [4, 8, 12]
# Projected entry: one adaptive step a tick, growing while a peaker's projected
# rent clears its own fixed cost and decaying below it. The step is damping, not
# physics, and it is deliberately coarse: the fixed point is what carries meaning,
# not the path taken to it.
entry_step_min_mw = 250.0
entry_decay = 0.5
# There is deliberately no tolerance on rent here. Rent is a step function of
# assumed entry, so there may be no quantity of entry at which it lands inside any
# band around break-even, and a rule that stops only when it lands there does not
# stop. The state converges in megawatts instead, and the resolution it stops at is
# one generating unit, which is read from unit_size_mw in tech_costs.csv because
# that is the finest distinction entry can actually be built in.

