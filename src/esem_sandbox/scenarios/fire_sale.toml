# The scheme, with an administrator that sells its position at a discount.
#
# Recycling conduct is a policy question with a real price attached. Warehousing
# offers the position at the market price and holds what no one buys; a fire sale
# offers every strip at half the market price and the discount lands on the levy,
# and what still finds no buyer is held. Neither is obviously right, which is the
# point of making it a lever rather than a constant.
[run]
leg = "esem"
ticks = 20

[esem]
recycling_conduct = "fire_sale"
